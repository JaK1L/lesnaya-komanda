name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Проверка кода перед деплоем
  check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Python syntax
        run: |
          cd backend
          python -m py_compile app/*.py || true

      - name: Check Frontend build
        run: |
          cd frontend
          npm ci
          npm run build

  # Деплой автоматически происходит через интеграции
  # Render, Vercel и Railway следят за main веткой
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: check
    
    steps:
      - name: Deployment started
        run: |
          echo "🚀 Deployment started!"
          echo "- Vercel will deploy frontend automatically"
          echo "- Render will deploy backend automatically"
          echo "- Railway will deploy bot automatically"

      - name: Wait for deployment
        run: sleep 120

      - name: Check Backend
        run: |
          response=$(curl -s https://lesnayakomanda.onrender.com/api/ || echo "error")
          if echo "$response" | grep -q "ok"; then
            echo "✅ Backend is healthy"
          else
            echo "⚠️ Backend might be starting (cold start)"
          fi

      - name: Check Frontend
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://lesnaya-komanda.vercel.app)
          if [ "$status" = "200" ]; then
            echo "✅ Frontend is healthy"
          else
            echo "❌ Frontend returned status: $status"
            exit 1
          fi

      - name: Deployment summary
        run: |
          echo "📊 Deployment Summary:"
          echo "- Frontend: https://lesnaya-komanda.vercel.app"
          echo "- Backend: https://lesnayakomanda.onrender.com"
          echo "- API Docs: https://lesnayakomanda.onrender.com/api/docs"
          echo "- Admin: https://lesnaya-komanda.vercel.app/admin"
